# Bouwt trader.exe op een Windows-machine van GitHub bij elke push naar main,
# en zet de download onder Releases > "Laatste versie".
name: Bouw trader.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Controle (syntax)
        run: python -m py_compile bot.py risk_gate.py kosten.py

      - name: trader.exe bouwen
        run: pyinstaller --onefile --name trader bot.py

      - name: Downloadpakket maken
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force trader | Out-Null
          Copy-Item dist\trader.exe, rules.json, .env.example, README.md trader\
          Compress-Archive -Path trader\* -DestinationPath trader-windows.zip -Force

      - name: Publiceren als "Laatste versie"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Laatste versie
          body: |
            Automatisch gebouwd uit commit ${{ github.sha }}.
            Pak trader-windows.zip uit, hernoem .env.example naar .env, vul je keys in en start trader.exe.
          files: trader-windows.zip
          make_latest: true
