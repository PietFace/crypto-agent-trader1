# Bouwt CryptoTrader.exe op een Windows-machine van GitHub bij elke push naar main,
# en zet de download onder Releases > "Laatste versie".
name: Bouw CryptoTrader.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Controle (syntax)
        run: python -m py_compile app.py bot.py settings.py risk_gate.py kosten.py remote.py followers.py backtest.py remote_jobs.py

      - name: CryptoTrader.exe bouwen
        run: >
          pyinstaller --noconfirm --onefile --windowed --name CryptoTrader
          --exclude-module tkinter --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.Qt3DCore
          --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml --exclude-module PySide6.QtMultimedia
          --exclude-module PySide6.QtPdf app.py

      - name: Downloadpakket maken
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force trader | Out-Null
          Copy-Item dist\CryptoTrader.exe, README.md trader\
          Compress-Archive -Path trader\* -DestinationPath trader-windows.zip -Force

      - name: Publiceren als "Laatste versie"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Laatste versie
          body: |
            Automatisch gebouwd uit commit ${{ github.sha }}.
            Pak trader-windows.zip uit en start CryptoTrader.exe. Keys en regels stel je in het programma in (Instellingen).
          files: trader-windows.zip
          make_latest: true
